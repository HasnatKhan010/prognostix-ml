[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prognostix-ml"
version = "0.1.0"
description = "Predictive maintenance: remaining useful life prediction for industrial equipment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hasnat Khan" }]
keywords = ["predictive-maintenance", "rul", "cmapss", "prognostics", "lstm", "gru"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime pins live in requirements.txt; this list keeps `pip install -e .` usable.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "torch>=2.0",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "prometheus-client>=0.20",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.29", "ipywidgets>=8.1", "seaborn>=0.13"]

[project.scripts]
prognostix-prepare = "scripts.prepare_data:main"
prognostix-train = "scripts.train:main"
prognostix-evaluate = "scripts.evaluate:main"
prognostix-predict = "scripts.predict:main"

[project.urls]
Repository = "https://github.com/HasnatKhan010/prognostix-ml"

[tool.setuptools]
# Flat layout: the importable roots are the top-level directories, matching the
# `from src...` / `from api...` imports used throughout the project.
packages = [
  "src",
  "src.ingestion",
  "src.preprocessing",
  "src.features",
  "src.models",
  "src.models.baseline",
  "src.models.lstm",
  "src.models.gru",
  "src.models.attention",
  "src.evaluation",
  "src.inference",
  "api",
  "monitoring",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Makes `pytest` work from the repository root without installing the project.
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", ".venv", "data", "artifacts"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",    # line length is enforced by the formatter, not the linter
  "B008",    # FastAPI's Depends/Query defaults are the documented pattern
  "RUF012",  # mutable class attributes without ClassVar
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals deliberately; scripts patch sys.path before importing.
"tests/*" = ["SIM117", "E402"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "api", "monitoring", "tests"]
