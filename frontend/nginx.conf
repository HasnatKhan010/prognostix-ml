# nginx configuration for the dashboard container.
#
# Serves the static dashboard and reverse-proxies the API under the same origin,
# so the browser needs no CORS exception and the frontend can use relative
# `/api/v1/...` paths.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_types        text/css application/javascript application/json;
    gzip_min_length   512;

    # The dashboard is a single static page; never cache it stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API, docs and the OpenAPI schema come from the api service.
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ ^/(docs|redoc|openapi\.json|health|metrics)$ {
        proxy_pass       http://api:8000;
        proxy_set_header Host $host;
    }
}
