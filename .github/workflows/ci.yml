name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Torch's default wheels carry ~2 GB of CUDA libraries that CI never uses.
  TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ruff

      - name: Lint
        run: ruff check src api monitoring scripts tests

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url "$TORCH_CPU_INDEX" \
            -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=src --cov=api --cov=monitoring --cov-report=term-missing

  pipeline:
    name: End-to-end pipeline smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url "$TORCH_CPU_INDEX" -r requirements.txt

      # The raw CMAPSS files are committed, so the whole chain runs here:
      # prepare -> train -> evaluate -> serve -> monitor.
      - name: Prepare data
        run: python scripts/prepare_data.py

      - name: Train (1 epoch, smoke only)
        run: python scripts/train.py --model gru --epochs 1 --no-plots

      - name: Evaluate
        run: python scripts/evaluate.py --model gru --split val --no-plots

      - name: Score the fleet
        run: python scripts/predict.py --model gru --top 5

      - name: Check for drift
        run: python -m monitoring.drift --current val || true

      - name: Start the API and query it
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/models
          curl -fsS "http://127.0.0.1:8000/api/v1/fleet?limit=3"
